<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8"/>
  <title>Gestión de Inventario</title>
  <meta name="description" content="Sistema de gestión de inventario y pedidos multiplataforma (PWA) construido con Ionic y Angular."/>

  <base href="/"/>

  <meta name="color-scheme" content="light"/>
  <meta name="theme-color" content="#1e40af"/>
  <!-- Se permite el zoom del usuario (WCAG 1.4.4): no se fijan maximum-scale ni user-scalable=no. -->

  <meta name="format-detection" content="telephone=no"/>
  <meta name="msapplication-tap-highlight" content="no"/>

  <link rel="icon" type="image/png" href="assets/icon/favicon.png"/>
  <link rel="apple-touch-icon" href="icons/icon-192x192.png"/>

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <link rel="manifest" href="manifest.webmanifest">
</head>

</html>
